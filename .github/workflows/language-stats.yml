name: Language Stats

on:
  push:
    branches:
      - main
  schedule:
    # 每天 23:59 中国时间 (UTC+8) = UTC 15:59
    - cron: '59 15 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Language Stats Analysis
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: icloudza
          AUTHOR_EMAILS: icloudza,icloudza@users.noreply.github.com,cloudza
          OUTPUT_DIR: assets
          SINCE_DAYS: '7'      # 本周语言统计窗口
          PROFILE_DAYS: '365'  # 作息画像 / 主要语言窗口
        run: python scripts/language_stats.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "chore: 更新统计卡片 [skip ci]"
          git push
